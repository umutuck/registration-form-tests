name: Registration Form – CI

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Check out source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # 3. Compile source + test classes
      - name: Compile project
        run: mvn compile test-compile --no-transfer-progress

      # 4. Execute all JUnit 5 tests
      - name: Run unit tests
        run: mvn test --no-transfer-progress

      # 5. Upload Surefire HTML/XML test report as artifact
      - name: Upload test report
        if: always()          # upload even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-report
          path: target/surefire-reports/
          retention-days: 14
